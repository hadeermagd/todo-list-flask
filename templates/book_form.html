<div class="card form-card">
    <h1>{% if book %}Edit Book{% else %}Add New Book{% endif %}</h1>

    <p class="subtitle">Enter the book information below.</p>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="title">Book Title</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="255"
                value="{{ book.title if book else '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="{{ book.price if book else '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="author_id">Author</label>
            <select id="author_id" name="author_id" required>
                <option value="">Choose an author</option>

                {% for author in authors %}
                <option
                    value="{{ author.author_id }}"
                    {% if book and book.author_id == author.author_id %}selected{% endif %}
                >
                    {{ author.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="cover_image">Book Cover (optional)</label>
            <input
                type="file"
                id="cover_image"
                name="cover_image"
                accept=".png,.jpg,.jpeg,.webp"
            >
            <small>Allowed formats: PNG, JPG, JPEG, WEBP.</small>
        </div>

        {% if book and book.cover_image %}
        <div class="form-group">
            <p>Current cover:</p>
            <img
                class="book-cover"
                src="{{ url_for('static', filename='images/' ~ book.cover_image) }}"
                alt="{{ book.title }} cover"
            >
        </div>
        {% endif %}

        <div class="actions">
            <button class="btn" type="submit">
                {% if book %}Save Changes{% else %}Add Book{% endif %}
            </button>

            <a class="btn btn-secondary" href="{{ url_for('books') }}">
                Cancel
            </a>
        </div>

    </form>
</div>
